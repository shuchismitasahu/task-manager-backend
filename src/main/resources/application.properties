spring.application.name=task_manager_backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=mySecretKeyForJWTTokenGenerationThatIsLongEnough1234567890
jwt.expiration=86400000

ai.openai.api-key=${OPENAI_API_KEY}
ai.openai.api-url=https://api.openai.com/v1/chat/completions
ai.openai.model=gpt-3.5-turbo

app.cors.allowed-origins=http://localhost:5173

logging.level.com.taskmanager=DEBUG
logging.level.org.springframework.security=INFO